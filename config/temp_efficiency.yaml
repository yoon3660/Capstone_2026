# ===========================================================================
#  온도-효율 테이블 (T-11)
#
#  scripts/seed_vehicles.py 가 temp_efficiency 테이블에 넣는다.
#  외기온은 시나리오 config 의 environment.temp_c 로 지정한다 (하드코딩 금지).
#  표에 없는 온도는 evdt.world.charging.temp_factors 가 선형보간한다.
#
#  range_factor         전비 계수. 20 °C 대비 같은 배터리로 갈 수 있는 거리 비율
#  charge_power_factor  충전출력 계수. 20 °C 대비 받을 수 있는 출력 비율
#
#  둘 다 20 °C = 1.0 이 기준점이다. 저온에서 두 계수가 같은 방향으로 떨어져서
#  "덜 가고 더 오래 충전한다" 가 되고, 이것이 명절(겨울) 충전 수요를 키운다.
#
#  ── range_factor 출처 ──────────────────────────────────────────────────
#  * 환경부 인증 저온/상온 주행거리: 저온 시험은 -6.7 °C, 상온은 23~25 °C.
#    아이오닉5 2WD 롱레인지 20인치 상온 405 km / 저온 354 km → 0.874.
#    국내 인증 기준이라 우리 시나리오(설 연휴)와 가장 가깝다. -7 °C 앵커.
#  * 언론 보도: 저온에서 전비가 약 20 % 낮다 (한국경제 2023-01, 한파 점검).
#  * Geotab 실주행 분석(520만 트립): 21.5 °C 에서 정격의 115 %, -15 °C 에서 54 %.
#    난방·단거리 주행이 섞인 실주행이라 인증보다 훨씬 가혹하다.
#    여기서는 **인증 기준을 채택**하고 그보다 낮은 온도만 Geotab 곡선 모양으로
#    완만히 연장했다. 즉 이 표는 보수적(저온 영향을 작게 보는) 쪽이다.
#    → 저온 영향 민감도 분석 때 Geotab 쪽 값으로 바꿔 보는 것이 후속 과제.
#
#  ── charge_power_factor 출처 ──────────────────────────────────────────
#  * Idaho National Laboratory: 25 °C 에서 30분 급속충전한 것과 비교해
#    0 °C 에서는 30분 뒤 충전량이 36 % 적다 → 0 °C 계수 0.64.
#  * Recurrent(급속충전 20만 건 분석): -18 °C 에서 같은 충전에 평균 9분 더 걸린다.
#    배터리 예열(preconditioning)을 안 하면 더 나빠진다.
#  * 고온(30 °C 이상)에서도 열관리로 출력이 조금 깎인다 — 완만하게 반영.
#
#  ⚠ 두 계수 모두 차종을 구분하지 않는다. 히트펌프 유무·배터리 예열 여부로
#    실제 차이가 크지만, 차종별 저온 데이터가 공개돼 있지 않다.
# ===========================================================================

# temp_c, range_factor, charge_power_factor, source
points:
  - [-20.0, 0.72, 0.45, "Geotab 저온 곡선 연장 + INL/Recurrent 저온 급속충전"]
  - [-10.0, 0.82, 0.55, "환경부 인증(-6.7 °C) 에서 연장 + INL/Recurrent"]
  - [-6.7,  0.87, 0.60, "환경부 인증 저온 주행거리(아이오닉5 354/405) / INL 보간"]
  - [0.0,   0.92, 0.64, "환경부 인증·언론 보도 보간 / INL 0 °C 충전량 -36 %"]
  - [10.0,  0.97, 0.85, "인증·실측 사이 보간"]
  - [20.0,  1.00, 1.00, "기준점 (상온)"]
  - [25.0,  1.00, 1.00, "환경부 상온 시험 온도(23~25 °C)"]
  - [30.0,  0.96, 0.95, "Geotab: 31 °C 이상에서 정격 미만 / 고온 열관리 감쇠"]
  - [35.0,  0.92, 0.85, "Geotab 고온 구간 + 고온 열관리 감쇠"]
