# ===========================================================================
#  차종 · 배터리 · 충전곡선 (T-10)
#
#  scripts/seed_vehicles.py 가 이 파일을 읽어 vehicle_class / charge_curve 에 넣는다.
#
#  충전곡선의 모양
#    참고 논문 Rupnik, Wang, Kramberger (2025) Systems 13(4) 272, Table 3 이
#    SoC 구간별 "차량 최대 수용출력 대비 비율" 을 준다.
#        SoC < 0.2     : 50~80 %
#        0.2 ~ 0.6     : 90~100 %
#        0.6 ~ 0.8     : 60~80 %
#        0.8 ~ 1.0     : 10~30 %
#    이 네 구간을 그대로 쓰되, 구간별 비율(power_frac)은 차종마다 공개 실측
#    10→80 % 충전시간에 맞춰 조정했다. 논문은 "대부분의 충전곡선이 비슷하게
#    움직인다" 는 가정으로 한 벌만 쓰지만, 실제로는 800V 차(아이오닉5)와
#    400V 차(모델Y·EV3)의 테이퍼가 크게 다르다 — 그대로 쓰면 모델Y 가
#    26분이 아니라 16분에 끝나 버린다.
#
#    reference_10_80_min 은 조정의 기준으로 쓴 공개값이고,
#    scripts/seed_vehicles.py 가 계산값과 나란히 출력한다.
#    tests/test_charging.py 가 ±15 % 안에 드는지 검사한다.
#
#  battery_kwh 는 사용 가능 용량(usable)이다. 총 용량이 아니다.
#  consumption_kwh_km 는 고속도로 주행 기준 상온 전비다 (복합 전비보다 나쁘다).
#
#  share 는 2025년 국내 신규등록 기준 대략값이며 합이 1.0 이어야 한다
#  (evdt.io.db.validate_master 가 검사).
# ===========================================================================

vehicle_classes:
  - vclass_id: import_mid_suv
    name: 수입 중형 SUV (테슬라 모델Y급, 400V)
    battery_kwh: 75.0
    vmax_kw: 250.0
    consumption_kwh_km: 0.200
    share: 0.30
    reference_10_80_min: 26.0
    # 모델Y 롱레인지 75kWh, V4 수퍼차저 실측 26분 / 피크 250kW
    source: "Tesla Model Y LR spec + 실측 리뷰(10→80% 26분); 2025 국내 신규등록 1위 모델"
    curve:
      - [0.0, 0.2, 0.40]
      - [0.2, 0.6, 0.58]
      - [0.6, 0.8, 0.40]
      - [0.8, 1.0, 0.12]

  - vclass_id: domestic_compact_suv
    name: 국산 소형·준중형 SUV (EV3·EV4·니로·코나급, 400V)
    battery_kwh: 81.4
    vmax_kw: 128.0
    consumption_kwh_km: 0.185
    share: 0.30
    reference_10_80_min: 31.0
    # 기아 EV3 롱레인지 81.4kWh, 기아 발표 10→80% 31분
    source: "기아 EV3 롱레인지 제원(81.4kWh, 10→80% 31분); 2025 국산 EV 판매 1위"
    curve:
      - [0.0, 0.2, 0.62]
      - [0.2, 0.6, 0.95]
      - [0.6, 0.8, 0.70]
      - [0.8, 1.0, 0.20]

  - vclass_id: domestic_mid_suv_800v
    name: 국산 중형 SUV·세단 (아이오닉5/6·EV6, 800V)
    battery_kwh: 80.0
    vmax_kw: 235.0
    consumption_kwh_km: 0.205
    share: 0.22
    reference_10_80_min: 19.0
    # 아이오닉5 롱레인지: 350kW 충전기에서 10→80% 18~20분, 피크 200~235kW
    source: "Hyundai IONIQ 5 LR 제원 + 충전 실측(10→80% 18~20분)"
    curve:
      - [0.0, 0.2, 0.65]
      - [0.2, 0.6, 0.95]
      - [0.6, 0.8, 0.70]
      - [0.8, 1.0, 0.20]

  - vclass_id: domestic_large_suv_800v
    name: 국산 대형 SUV (EV9·아이오닉9, 800V)
    battery_kwh: 99.8
    vmax_kw: 240.0
    consumption_kwh_km: 0.255
    share: 0.10
    reference_10_80_min: 24.0
    # EV9 GT-Line 99.8kWh 실측 24분 / 피크 240kW (제조사 표기 18분보다 보수적)
    source: "Kia EV9 제원 + 실측 리뷰(10→80% 24분, 피크 240kW)"
    curve:
      - [0.0, 0.2, 0.60]
      - [0.2, 0.6, 0.88]
      - [0.6, 0.8, 0.62]
      - [0.8, 1.0, 0.18]

  - vclass_id: domestic_mini
    name: 국산 경형·소형 (캐스퍼 일렉트릭급, 400V)
    battery_kwh: 49.0
    vmax_kw: 100.0
    consumption_kwh_km: 0.165
    share: 0.08
    reference_10_80_min: 30.0
    # 캐스퍼 일렉트릭 49kWh, 120kW 충전기에서 10→80% 30분 (차량 수용은 약 100kW)
    source: "현대 캐스퍼 일렉트릭 제원(49kWh, 10→80% 30분)"
    curve:
      - [0.0, 0.2, 0.55]
      - [0.2, 0.6, 0.80]
      - [0.6, 0.8, 0.55]
      - [0.8, 1.0, 0.15]

# ---------------------------------------------------------------------------
# share 출처 (2025년 국내 신규등록, 승용 EV 기준 대략값)
#   - 2025 신규등록 약 22만 대, 침투율 13.1 %
#   - 테슬라 모델Y 단일 모델 약 4.7만 대(1~11월) — 승용 EV 의 약 1/4~1/3
#   - 기아 EV 시리즈(EV3·4·5·6·9) 약 4.0만 대, 그중 EV3 가 국산 1위
#   - 현대 EV(제네시스 포함) 약 2.8만 대
#   위 비중은 모델 단위 공시 통계가 아니라 기사·업계 집계를 묶은 값이다.
#   KAMA/카이즈유 모델별 확정 통계가 나오면 갱신할 것 (후속 이슈).
# ---------------------------------------------------------------------------
