# ===========================================================================
#  차종 · 배터리 · 충전곡선 (T-10)
#
#  scripts/seed_vehicles.py 가 이 파일을 읽어 vehicle_class / charge_curve 에 넣는다.
#
#  ── 차종을 왜 5종으로 묶었는가 ────────────────────────────────────────
#  시뮬레이션에서 필요한 것은 차명이 아니라 (사용 배터리, 최대 수용출력, 전비,
#  곡선 모양) 네 가지다. 이 네 값이 비슷한 차는 큐에서 같은 행동을 한다.
#  그래서 국내 등록 상위 차들을 충전 거동 기준으로 5개 묶음으로 나누고,
#  각 묶음에서 등록대수가 가장 많은 차 하나를 대푯값으로 삼았다.
#
#  ── 값의 출처 표기 ────────────────────────────────────────────────────
#  battery_kwh          제조사·환경부 인증 표기 용량. 총용량에 가까운 값이다.
#                       (사용가능 용량은 이보다 작지만 차종별로 공시되지 않는다.
#                        곡선을 실측 시간에 맞춰 보정하므로 충전시간은 영향을 안 받고,
#                        '완충에 드는 에너지' 만 조금 크게 잡히는 보수적 방향이다.)
#  vmax_kw              차량이 받을 수 있는 최대 DC 출력. 제조사 스펙·충전 실측 피크.
#  consumption_kwh_km   고속도로 주행 기준 상온 전비.
#                       1순위: 환경부 인증 '고속도로 주행거리 ÷ 배터리 용량'
#                       2순위: 인증 복합전비 × 0.92
#                         (0.92 는 고속/복합 인증 주행거리 비율에서 나왔다 —
#                          모델Y 497/523 = 0.95, EV3 455/510 = 0.89 의 중간)
#  share                2025년 국내 신규등록 기준 비중. 합 1.0 (validate_master 검사).
#  reference_10_80_min  350kW 급속충전기에서의 공개 10→80 % 시간. 곡선 보정 기준.
#
#  ── 충전곡선 ──────────────────────────────────────────────────────────
#  구간 경계와 기본 비율은 참고 논문
#    Rupnik, B., Wang, Y., Kramberger, T. (2025) "Hybrid Model for Motorway EV
#    Fast-Charging Demand Analysis Based on Traffic Volume", Systems 13(4), 272.
#    https://doi.org/10.3390/systems13040272  (open access, CC BY) Table 3
#  이 SoC 구간별 '차량 최대 수용출력 대비 비율' 을 준다.
#      SoC < 0.2 : 50~80 %   0.2~0.6 : 90~100 %
#      0.6~0.8   : 60~80 %   0.8~1.0 : 10~30 %
#  아래 base 는 그 중간값 (0.65 / 0.95 / 0.70 / 0.20) 이다.
#
#  논문은 "대부분의 충전곡선이 비슷하게 움직인다" 며 한 벌만 쓰는데, 실제로는
#  E-GMP(800V) 계열만 이 값에 맞는다. 아래 scale 은 공개 실측 10→80 % 시간에서
#  역산한 배율이고, 곡선 비율 = base × scale 이다. scale 이 1.0 이면 논문 값 그대로다.
#      논문 그대로 썼을 때 → 조정 후 (공개 실측)
#      모델Y급    15.5분 → 25.9분 (26분)    scale 0.673
#      EV9급      21.5분 → 23.5분 (24분)    scale 0.894
#      캐스퍼급   25.3분 → 30.7분 (30분)    scale 0.843
#      아이오닉5급 18.4분 → 18.4분 (18~20분) scale 1.0 (논문 값 그대로 오차 3 %)
#      EV3급      32.8분 → 32.8분 (31분)    scale 1.0 (논문 값 그대로 오차 6 %)
#  tests/test_charging.py 가 계산값이 공개 실측의 ±15 % 안인지 검사한다.
# ===========================================================================

vehicle_classes:
  - vclass_id: import_mid_suv
    name: 수입 중형 SUV (모델Y급)
    representative: Tesla Model Y Long Range (2025 주니퍼)
    why_representative: >-
      2025년 국내 단일 모델 판매 1위(1~11월 약 4.7만 대)로 승용 EV 의 1/4 이상.
      400V·NMC·수퍼차저 계열을 대표한다. 국산 800V 차보다 테이퍼가 일찍 시작돼
      같은 배터리 크기에서도 충전이 더 오래 걸리는 그룹이다.
    battery_kwh: 84.8
    vmax_kw: 250.0
    consumption_kwh_km: 0.171
    share: 0.30
    reference_10_80_min: 26.0
    source: >-
      배터리·전비: 환경부 인증 (2025-06-30, 239Ah ≈ 84.84kWh, 상온 고속도로 497km
      → 497/84.84 = 5.86 km/kWh). 최대출력: Tesla 공식 스펙 250kW(V3/V4 수퍼차저).
      10→80 %: 250kW 급속충전 실측 리뷰 26분. 비중: 카이즈유·업계 집계 2025 신규등록.
    curve:   # base × 0.673
      - [0.0, 0.2, 0.437]
      - [0.2, 0.6, 0.639]
      - [0.6, 0.8, 0.471]
      - [0.8, 1.0, 0.135]

  - vclass_id: domestic_compact_suv
    name: 국산 소형 SUV (EV3급)
    representative: Kia EV3 Long Range (81.4kWh)
    why_representative: >-
      2025년 국산 EV 판매 1위(1~8월 약 1.6만 대). EV4·EV5·니로 EV·코나 일렉트릭이
      400V·100~130kW 수용출력으로 충전 거동이 거의 같아 한 묶음으로 본다.
      배터리는 큰데 수용출력이 낮아 점유시간이 길다 — 큐에 가장 부담을 주는 그룹.
    battery_kwh: 81.4
    vmax_kw: 128.0
    consumption_kwh_km: 0.179
    share: 0.30
    reference_10_80_min: 31.0
    source: >-
      배터리·전비: 기아 공식 제원 81.4kWh, 환경부 인증 고속도로 455km
      → 455/81.4 = 5.59 km/kWh (인증 복합 510km / 복합전비 5.4 km/kWh).
      최대출력·10→80 %: 기아 공식 발표 (350kW 충전기에서 31분).
      비중: 카이즈유·업계 집계 2025 신규등록.
    curve:   # base × 1.0 (논문 Table 3 중간값 그대로)
      - [0.0, 0.2, 0.65]
      - [0.2, 0.6, 0.95]
      - [0.6, 0.8, 0.70]
      - [0.8, 1.0, 0.20]

  - vclass_id: domestic_mid_suv_800v
    name: 국산 중형 800V (아이오닉5급)
    representative: Hyundai IONIQ 5 Long Range 2WD (84kWh, 2024 이후)
    why_representative: >-
      E-GMP 800V 플랫폼 대표. EV6·아이오닉6 가 같은 플랫폼·유사 충전 성능이라
      한 묶음이다. 고속도로 급속충전에서 가장 유리한 그룹(350kW 충전기를 제대로
      쓰는 유일한 국산 승용군)이라, 충전기 출력별 차이를 보려면 반드시 필요하다.
    battery_kwh: 84.0
    vmax_kw: 235.0
    consumption_kwh_km: 0.226
    share: 0.22
    reference_10_80_min: 19.0
    source: >-
      배터리: 현대 공식 제원 84kWh(2024 연식변경). 전비: 인증 복합 4.5~5.2 km/kWh
      의 중앙값 4.8 × 0.92(고속도로 보정) = 4.42 km/kWh.
      최대출력·10→80 %: 350kW 충전기 충전 실측 18~20분, 피크 200~235kW.
      비중: 카이즈유·업계 집계 2025 신규등록(현대 EV 약 2.8만 대 + EV6).
    curve:   # base × 1.0 (논문 Table 3 중간값 그대로)
      - [0.0, 0.2, 0.65]
      - [0.2, 0.6, 0.95]
      - [0.6, 0.8, 0.70]
      - [0.8, 1.0, 0.20]

  - vclass_id: domestic_large_suv_800v
    name: 국산 대형 SUV (EV9급)
    representative: Kia EV9 (99.8kWh)
    why_representative: >-
      100kWh 급 대형 SUV 대표(아이오닉9 동급). 대수는 적지만 한 대가 차지하는
      충전 시간이 가장 길어 큐 길이에 주는 영향이 크다. 명절 장거리 가족 이동과
      겹치는 차급이라 설 시나리오에서 비중이 더 올라갈 수 있다.
    battery_kwh: 99.8
    vmax_kw: 240.0
    consumption_kwh_km: 0.279
    share: 0.10
    reference_10_80_min: 24.0
    source: >-
      배터리·전비: 기아 공식 제원 99.8kWh, 인증 복합 3.6~4.2 km/kWh 중앙값 3.9
      × 0.92 = 3.59 km/kWh. 최대출력·10→80 %: 충전 실측 24분·피크 240kW
      (제조사 표기 18분보다 보수적인 실측값을 채택).
      비중: 카이즈유·업계 집계 2025 신규등록.
    curve:   # base × 0.894
      - [0.0, 0.2, 0.581]
      - [0.2, 0.6, 0.849]
      - [0.6, 0.8, 0.626]
      - [0.8, 1.0, 0.179]

  - vclass_id: domestic_mini
    name: 국산 경형 (캐스퍼급)
    representative: Hyundai 캐스퍼 일렉트릭 (49kWh, 인스퍼레이션)
    why_representative: >-
      경형·소형 대표. 차량 수용출력이 100kW 라 350kW 충전기를 붙여도 이득이 거의
      없고, 반대로 50kW 충전기에서 손해가 가장 적다. "급속기 출력이 올라가도
      혜택을 못 받는 차" 가 있다는 것을 모델에 남기기 위해 별도 묶음으로 둔다.
    battery_kwh: 49.0
    vmax_kw: 100.0
    consumption_kwh_km: 0.194
    share: 0.08
    reference_10_80_min: 30.0
    source: >-
      배터리·전비: 현대 공식 제원 49kWh, 인증 복합 5.6 km/kWh(인스퍼레이션 15인치)
      × 0.92 = 5.15 km/kWh. 10→80 %: 현대 공식 30분(120kW 충전기 기준).
      차량 수용출력 약 100kW. 비중: 카이즈유·업계 집계 2025 신규등록.
    curve:   # base × 0.843
      - [0.0, 0.2, 0.548]
      - [0.2, 0.6, 0.801]
      - [0.6, 0.8, 0.590]
      - [0.8, 1.0, 0.169]

# ---------------------------------------------------------------------------
# 비중(share) 의 한계
#   모델 단위 등록대수는 공식 통계로 공시되지 않는다. 위 비중은
#     - 2025 신규등록 약 22만 대, 침투율 13.1 %
#     - 모델Y 1~11월 약 4.7만 대 (테슬라 전체 약 6.0만 대)
#     - 기아 EV 시리즈 약 4.0만 대 (EV3 가 국산 1위)
#     - 현대 EV(제네시스 포함) 약 2.8만 대
#   같은 기사·업계 집계를 충전 거동 묶음으로 배분한 값이다.
#   KAMA·카이즈유 모델별 확정 통계가 나오면 갱신할 것 (후속 이슈).
# ---------------------------------------------------------------------------
