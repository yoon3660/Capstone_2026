# ===========================================================================
#  ⚠⚠  이 파일의 결과는 **사용자 평형(UE)이 아니다**  ⚠⚠
#
#  gap_tol 을 5% 로 풀었고, 그러면 **첫 sweep 에 통과한다** (반복 1회).
#  전원이 한 번씩 고르고 끝났다는 뜻이지 "아무도 바꾸고 싶지 않은 상태" 가 아니다.
#  #29 가 3% 를 버린 이유가 정확히 이것이다 — 그보다 더 느슨하다.
#
#  쓸 곳    히트맵·시각화. "조율이 없으면 이렇게 된다" 를 **보여주는** 용도
#  쓸 수 없는 곳  엔진 비교의 기준선. 바닥이 균형이 아니면
#                 "엔진이 균형보다 낫다" 를 주장할 수 없다
#
#  엔진 비교는 scenario_seollal_down_adoption.yaml (11회 수렴) 에서 한다.
#
#  왜 이 파일이 필요한가 — 0.8% 로는 이 수요에서 수렴하지 않는다. gap 이 2.3~3.1%
#  에서 추세 없이 진동한다. 그 사이의 값은 없다: 3% 로 잡아도 첫 sweep 통과이거나
#  진동이다. 그래서 "보여주는 그림" 과 "비교하는 기준선" 을 **다른 파일로 갈랐다**.
#
#  ⚠ 균형이 **존재하지 않는다**는 뜻은 아니다. 우리가 쓰는 최적반응 반복 하나가
#    가라앉지 않는다는 것뿐이다 (docs/where_we_are.md §6).
# ===========================================================================

# ===========================================================================
#  설 연휴 귀성 피크 · 경부선 하행  —  UE 베이스라인
#
#  실험 1개 = 이 파일 1장. 새 시나리오는 이 파일을 복사해서 만든다.
#  여기 없는 키를 넣으면 로딩 시점에 "알 수 없는 최상위 키" 로 터진다 (오타 방지).
# ===========================================================================

scenario_id: seollal_2026_down_congested
label: "설 연휴 귀성 피크 (경부선 하행) — 혼잡 시나리오 (⚠ 균형 아님)"
corridor_id: gyeongbu_down
direction: DOWN
day_type: SEOLLAL_PEAK

time:
  start_min: 0       # 00:00
  end_min: 1440      # 24:00
  # Δt. **S0 이후 스테이지가 정책에게 물어보는 주기**이자 앱 화면의 갱신 주기다 (#59).
  # 결정 시점이 [t, t+Δt) 인 차는 t 의 화면을 본다 — 즉 이 값이 **정보의 나이 상한**이다.
  # UE 는 재계획을 안 하므로 로깅 주기로만 쓴다.
  dt_min: 5

demand:
  # T-07 산출물. 시간대별 교통량 프로파일 (방향별)
  # 재현 기간 — 무대를 갈아끼우는 스위치 (src/evdt/replay.py)
  #   scripts/build_replay.py --period <기간> --direction <방향>
  period: seollal2026
  volume_profile: data/processed/volume_gyeongbu_down_seollal.csv
  demand_multiplier: 1.0
  # ⚠ 잠정값이다. 근거 확정은 #67 (3차 스프린트).
  #   8% 면 가동률 90%·포화 8/19 로 이미 포화라 엔진이 옮길 자리가 없다.
  #   5% 는 티핑 포인트(4→5%) 바로 위 — 쏠림은 있고 빈 곳도 있다.
  #   "티핑 포인트라서" 는 근거가 아니다. #67 에서 출처로 바꾼다.
  ev_share: 0.05            # 통과 차량 중 EV 비중
  # EV 시간대별 생성 방식 (fixed | poisson | binomial | beta_binomial | poisson_lognormal), #53
  ev_count_method: fixed
  # 실험용 확장 모델 파라미터 (#53)
  beta_binomial_concentration: 10000.0
  poisson_lognormal_sigma: 0.05
  # ⚠ **죽은 값이다. 바꿔도 결과가 안 바뀐다** (#54 · #59 에서 확인).
  #   should_charge 를 부르는 곳이 없고, S0 도 쓰지 않는다 — 확률로 충전 여부를 뽑으면
  #   UE 와 S0 가 **다른 차량 집합**을 상대하게 되어 비교가 성립하지 않는다.
  #   충전 여부는 수요를 만들 때 한 번만 정한다 (engine/ue_demand.build_trip_demands).
  charge_prob: 0.95
  # 실측 위에 **가정으로 얹는 것**은 전부 여기로만 들어온다 (#54).
  #   - 모르는 kind 는 로딩 시점에 거부한다
  #   - 레이어는 모두 가정이다. 실측은 레이어가 아니라 바탕이다
  #   - 이름 한 줄이 실행 파라미터와 **모든 그림 부제**에 찍힌다
  # 비어 있으면 그림 부제가 '가정 레이어 없음' 이 된다 = 순수 재현.
  #   예: - {kind: ev_adoption, ev_share: 0.25}
  layers:
    # ⚠ **이 파일은 재현이 아니라 시나리오다.** 아래 둘은 가정이고, 라벨이 모든 그림
    #    부제에 따라 붙는다. 재현 기준선은 scenario_seollal_down.yaml (layers 비어 있음).
    #
    # EV 보급률 — UE 가 수렴하는 가장 혼잡한 지점이다 (#55).
    #   EV 비중만 올려서는 쏠림이 안 생긴다 — 충전 필요 **비율**이 4.3% 로 고정이라
    #   히트맵이 고르게 진해질 뿐 모양이 안 바뀐다 (docs/demand_layers.md §4).
    #   22% 까지 올리면 UE 반복이 41회로 뛰고 25% 부터는 수렴하지 못하는데, 그래도
    #   평균 대기는 0.13분이다. 그래서 대수가 아니라 **행동**으로 수요를 만든다.
    - {kind: ev_adoption, ev_share: 0.15}
    # 기회 충전 — 필요해서가 아니라 **들른 김에** 꽂는 행동 (#54).
    #   명절 고속도로에서 실제로 일어나므로 수요를 부풀리는 가정이 아니라 **운전자
    #   행동 모델의 파라미터**다. #64 충전 실측 조사가 이 값을 보정한다.
    #
    #   ⚠ long_distance 레이어를 쓰려 했으나 **지금 코드 경로에서 죽어 있다** (#55 에서
    #     확인). #54 가 목적지 생성을 진출 프로파일로 바꾸면서 연결이 끊겼고,
    #     config 에 넣어도 아무 일이 일어나지 않는다. 별도 티켓으로 뺀다.
    #
    #   0.20 은 **UE 가 수렴하는 최대값**이다 (시드 1, 하행).
    #       0.10 → 반복  1회 · 총 체류 1,019h
    #       0.20 → 반복 11회 · 총 체류 1,542h   ← 채택
    #       0.30 → 50회 안에 수렴 실패 (gap 2.56%)
    #       0.50 → 50회 안에 수렴 실패 (gap 2.63%)
    #   수렴 실패는 반복을 늘려서 풀리지 않는다 — gap 궤적에 **추세가 없다**.
    #   기회 충전 차는 충전이 꼭 필요하지 않아 작은 차이로 선택이 뒤집히고, 그런 차가
    #   1만 대면 집단으로 진동한다. 충전이 필요한 차만 있을 때는 수렴한다.
    - {kind: opportunity_charge, prob: 0.20, soc_margin: 0.5}
  safety_buffer_km: 30.0    # Rupnik 규칙의 안전버퍼
  low_soc_threshold: 0.2    # 이 아래면 무조건 충전
  # 목적지 분포: 서울에서 출발한 차 중 각 지점을 지나가는 비율 (scripts/build_demand_profile.py)
  through_profile: data/processed/through_gyeongbu_down_seollal.csv
  # 중간 진입·진출 (#54). 있으면 through_profile 대신 이걸 쓴다
  #   scripts/build_entry_exit_profile.py --direction DOWN
  entry_exit_profile: data/processed/entry_exit_gyeongbu_down_seollal.csv
  # 실측 OD 로 **목적지만** 바꿔 끼운다 (#99). null 이면 exit_share 위험률 모델 그대로다.
  #   켜면 P(목적지 | 기점) 에서 뽑는다 — 위험률 모델은 "목적지가 진입 지점과 무관"
  #   하다고 가정하는데, 실측으로 재 보니 서울 진입차 p50 이 16.8 → 63.1 km 였다.
  # ⚠ 진입 **시각**은 여전히 VDS 가 준다 — OD 는 일자별 집계라 hour 가 없다.
  od_profile: null
  cruise_speed_kmh: 80.0    # 휴게소 사이 주행 속도. Sprint 2 에 CTM 속도로 바뀐다
  # 휴게소 줄이 이보다 길면 IC 로 빠져 시내에서 충전하고 돌아온다 (#54)
  #   KPI n_escaped 로 남는다. 엔진이 이 수를 줄이는 것도 개선이다
  #   ⚠ 120분은 잠정값. 근거는 #64 (충전 실측 조사)
  escape_cost_min: 120.0
  # 이탈 비용의 산포 (로그정규 sigma) (#78) — **차마다 다르다.**
  #   0 이면 전원이 위 값을 그대로 쓰는데, 그러면 그 값 근처에 질량이 몰려
  #   "나갈까 말까" 경계에 선 차가 수천 대가 되고 집단으로 뒤집히며 진동한다.
  #   실제로 escape_cost_min 60 에서 20시드 중 10개가 수렴에 실패했다
  #   (gap 이 5.3~6.4% 에서 추세 없이 흔들렸다).
  #   집이 근처라 금방 나가는 사람과 끝까지 기다리는 사람은 실제로 공존한다.
  #   ⚠ 아직 0 이다 — 켜면 결과가 움직이므로 #78 민감도와 같이 정한다.
  escape_cost_sigma: 0.0
  # 통행시간을 무엇으로 재나 (#56): fixed = 위 고정 속도 · ctm = CTM 셀 속도
  travel_time: fixed

vehicles:
  seed: 7                   # 시드 고정. 같은 시드면 모든 스테이지가 같은 차량 집합을 받는다
  # 출발 SoC (서울 진입 시점) ~ lo + Beta(a, b) × (hi − lo).  실험 스위치: low | high
  #   python scripts/run_ue.py --soc high      (config 를 고치지 않고 바꿔 돌린다)
  # 이 값이 쏠림의 크기를 거의 다 정한다 (docs/UE_equilibrium.md §5).
  # 진입 SoC 분포. 근거와 반대 근거는 docs/departure_soc.md (#55).
  # ⚠ low 는 Rupnik 의 **휴게소 도착 SoC** 를 진입 SoC 로 쓰던 #55 이전 기본값이다.
  departure_soc: holiday
  soc_profiles:
    # ── 진입 SoC = 고속도로에 **올라올 때** 배터리. 휴게소 도착 SoC 가 아니다 (#55) ──
    holiday:                # 평균 66.5% · 중앙값 65.8% · p5 40.3%. docs/departure_soc.md
      dist: lognormal       #   고속도로 EV 충전 부하 문헌의 표준 (Bai et al. 2026)
      mu: -0.3567           #   ⚠ ln(0.70) 은 **절삭 전** 중앙값이다. 상단 1.0 절삭 때문에
                            #     실제 중앙값은 65.8% 로 더 낮다 — mu 를 중앙값으로 읽지 말 것
      sigma: 0.35           #   모른다는 것을 넓이로 반영했다. 꼬리가 중심보다 2배 더 움직인다
      lo: 0.33              #   ⚠ 행태 가드레일. 관측이 아니라 가정이다.
      hi: 1.00              #     1.6% 만 걸린다 — 바닥이 분포를 대신하면 안 된다.
                            #     바로 위 33~40% 구간도 4.6% 로 꼬리에 머문다 (테스트가 지킨다)
    # ── 아래 둘은 민감도 대조군이다. 본 실험에 쓰지 않는다 ──
    low:                    # 평균 34%. ⚠ Rupnik 의 **휴게소 도착 SoC** 를 진입 SoC 로 쓴 것 (#55 이전 기본값)
      a: 2.0
      b: 5.0
      lo: 0.10
      hi: 0.95
    high:                   # 평균 76%. "전날 집에서 충전하고 출발" 가정 (근거 없음)
      a: 5.0
      b: 2.0
      lo: 0.30
      hi: 0.95
  target_soc_cap: 0.8       # 목표 SoC 상한 (§2.3). 결정변수에서 제외
  # 습관 목표 SoC (#82) — 사람은 "필요한 만큼" 만 채우지 않는다.
  #   국내 실측 **잔량 30% → 85%** (김범일 외 2022). 0 이면 목적지까지 갈 만큼만
  #   채워서 충전 종료 SoC 가 52.9% · 충전시간 9.1분으로 **대기가 과소평가된다.**
  #   ⚠ 상한(0.8)이 천장이라 0.85 를 넣어도 80% 에서 잘린다.
  habit_soc: 0.0

environment:
  temp_c: -5.0              # 설 기준 저온. T-11 온도-효율 테이블과 함께 쓰인다

policy:
  stage: UE
  participation: 1.0        # UE/S0 는 조정을 안 하므로 반드시 1.0
  params: {}
  ue:                       # UE 균형 반복 (engine/ue.py, docs/UE_equilibrium.md)
    max_iter: 50            # 반복 1회 = 전원이 도착 순서대로 한 번씩 다시 고름. 넘으면 FAILED
    # 3% 는 첫 sweep 에 통과해 "균형" 이라 부를 수 없었다 (반복 1회).
    # 0.8% 면 반복 5회 — 최적반응을 여러 번 돌았다고 말할 수 있고 비용이 2.5배다.
    # 0.7% 는 12회, 0.6% 는 28회로 급해지는데 KPI 는 나아지지 않는다.
    #   ⚠ 위 반복 횟수는 #54 **이전** 수요(EV 를 3.5배 적게 세던 때)에서 잰 것이다.
    #     지금 수요에서는 시드 20개 평균 **하행 9.8회 · 상행 2.0회** 다
    #     (reference/baseline_*.csv 의 ue_iterations). gap_tol 을 고른 근거는 그대로다.
    #
    # ⚠ KPI 로 고른 값이 아니다. 이탈 선택지가 생기면서 **균형해가 여럿**이 됐고
    #   (누가 나가느냐에 따라 달라진다) 0.5~1.0% 사이 평균 대기가 19.7~21.4분으로
    #   방향 없이 흔들린다. 그 폭(±0.85분)이 시드 산포(±0.95분)와 비슷하다.
    #   그래서 **엔진과 비교할 때는 양쪽을 같은 gap_tol 로 고정해야 한다.**
    # ⚠ 재현 기준선은 0.008 이다. 여기만 5% 다 — 위 머리말을 읽을 것.
    #    run_kpi 의 ue_first_sweep_pass 가 1 로 찍힌다 (= 균형 아님).
    gap_tol: 0.05
    min_gain_min: 1.0       # 1분도 안 줄어드는 변경은 하지 않는다
    max_stops: 3            # 한 차가 계획할 수 있는 최대 충전 정차 수

queue:
  discipline: FIFO              # 도착순
  charger_select: MAX_POWER_IDLE  # 유휴 충전기 중 최고출력, 없으면 최단 해제 대기

output:
  write_snapshots: true
  snapshot_every_min: 5
