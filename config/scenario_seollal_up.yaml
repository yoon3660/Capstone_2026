# ===========================================================================
#  설 연휴 귀경 피크 · 경부선 상행  —  UE 베이스라인
#
#  하행과의 차이는 corridor / direction / 교통량 프로파일뿐이다.
#  "상행 출발 SoC 가 하행보다 낮을 수 있다" 는 고정 가정이 아니라
#  민감도 파라미터다 (§2.3). 기본값은 하행과 동일하게 두고,
#  민감도 실험에서 출발 SoC 프로파일(low / high)을 바꿔 본다 (--soc high).
# ===========================================================================

scenario_id: seollal_2026_up_base
label: "설 연휴 귀경 피크 (경부선 상행) — UE 베이스라인"
corridor_id: gyeongbu_up
direction: UP
day_type: SEOLLAL_PEAK

time:
  start_min: 0
  end_min: 1440
  dt_min: 5

demand:
  # 재현 기간 — 무대를 갈아끼우는 스위치 (src/evdt/replay.py)
  #   scripts/build_replay.py --period <기간> --direction <방향>
  period: seollal2026
  volume_profile: data/processed/volume_gyeongbu_up_seollal.csv
  demand_multiplier: 1.0
  ev_share: 0.08
  charge_prob: 0.95
  safety_buffer_km: 30.0
  low_soc_threshold: 0.2
  # 목적지 분포: 부산(구서) 쪽에서 출발한 차 중 각 지점을 지나가는 비율
  #   scripts/build_demand_profile.py --direction UP
  through_profile: data/processed/through_gyeongbu_up_seollal.csv
  # 중간 진입·진출 (#54). 있으면 through_profile 대신 이걸 쓴다
  #   scripts/build_entry_exit_profile.py --direction UP
  entry_exit_profile: data/processed/entry_exit_gyeongbu_up_seollal.csv
  cruise_speed_kmh: 80.0
  # 통행시간을 무엇으로 재나 (#56): fixed = 위 고정 속도 · ctm = CTM 셀 속도
  travel_time: fixed

vehicles:
  seed: 7
  # 출발 SoC — 하행과 같은 두 프로파일 (scenario_seollal_down.yaml 설명 참고)
  departure_soc: low
  soc_profiles:
    low:
      a: 2.0
      b: 5.0
      lo: 0.10
      hi: 0.95
    high:
      a: 5.0
      b: 2.0
      lo: 0.30
      hi: 0.95
  target_soc_cap: 0.8

environment:
  temp_c: -5.0

policy:
  stage: UE
  participation: 1.0
  params: {}
  ue:
    max_iter: 50
    gap_tol: 0.03
    min_gain_min: 1.0
    max_stops: 3

queue:
  discipline: FIFO
  charger_select: MAX_POWER_IDLE

output:
  write_snapshots: true
  snapshot_every_min: 5
