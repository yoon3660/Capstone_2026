# ===========================================================================
#  CTM 교통류 파라미터 (T-08 / #24)
#
#  defaults / sensitivity는 모델 설정값.
#  DOWN / UP의 measured 값은 scripts/estimate_flow_params.py가 갱신한다.
#  생성: 2026-09-20 11:52  /  기간: base202603, seollal2026
#
#  source:
#    measured  VDS 또는 표준노드링크 실측
#    derived   triangular FD 관계식으로 계산
#    assumed   직접 관측하기 어려워 config 기준값 사용
#
#  triangular FD:
#    q_max_per_lane = v_free * w_back * k_jam / (v_free + w_back)
# ===========================================================================

# CFL 조건: 한 스텝에 차가 셀 하나를 넘어가면 CTM 이 성립하지 않는다.
#   v_free * dt <= min_cell_length_km
#   100 km/h, 0.5 km 셀 -> dt <= 0.30분
dt_min: 0.2

defaults:
  v_free_kmh: 100.0
  w_back_kmh: 18.0
  k_jam_veh_km_lane: 144.0
  lanes: 4
  q_max_anchor_veh_h_lane: 2200.0
  # 차로 프로파일 병합 임계값. 이보다 짧은 차로 구간은 이웃에 병합한다.
  min_cell_length_km: 0.5
  # CTM 셀 목표 길이. 앵커 사이 간격을 floor(g / 이 값) 등분한다.
  # 위 값과 다르다 — 같은 키로 읽으면 셀이 전부 0.5 km 가 된다 (docs/T17_cells.md).
  cell_length_km: 1.0

sensitivity:
  k_jam_veh_km_lane: [132.0, 144.0, 169.0]

# 콘존별 VDS 분석:
#   data/processed/flow_params_by_conzone.parquet
#
# 차로수:
#   data/processed/lanes_gyeongbu.parquet
#   값이 있으면 measured, 없으면 defaults.lanes 사용

DOWN:

  v_free_kmh:
    value: 96.4
    source: measured
    method: 새벽 3~5시 관측속도의 85퍼센타일, 콘존별 추정값의 중앙값
    iqr: [94.1, 99.6]
    n_conzones: 57
    assumed_was: 100.0

  w_back_kmh:
    value: 18.0
    source: assumed
    note: >-
      정체파 후진 전파속도는 VDS 교통량만으로 안정적으로 직접
      추정하지 않고 defaults의 기준값을 사용한다.

  k_jam_veh_km_lane:
    value: 144.0
    source: assumed
    implied_vehicle_spacing_m: 6.94
    sensitivity: [132.0, 144.0, 169.0]
    note: >-
      정체밀도는 VDS만으로 직접 관측하기 어렵기 때문에
      민감도 분석 대상으로 남긴다.

  q_max_veh_h_lane:
    value: 2184.2
    source: derived
    formula: v_free * w_back * k_jam / (v_free + w_back)
    reference_anchor: 2200.0
    note: >-
      q_max는 독립 입력값이 아니라 v_free, w_back, k_jam으로
      계산한다. reference_anchor는 파라미터 조합의
      물리적 타당성을 검산하는 기준값이다.

  observed_vds:
    breakdown_flow_veh_h_section:
      median: 4000.2
      iqr: [2893.6, 5070.4]
      n_conzones: 16
    p95_hourly_volume_veh_h_section:
      median: 3333.7
      iqr: [2736.1, 4736.5]
      n_conzones: 57
    note: >-
      위 값은 콘존 전체의 관측 교통량이다.
      차로당 CTM q_max로 직접 사용하지 않는다.

