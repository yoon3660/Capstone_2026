# 평시(2026-03-06) 교통량 위에 **추석 무대와 같은 수요 가정**을 올린 비교 무대.
#
# ## 왜 따로 두나 — 한 번에 한 가지만 바꾼다
#
# `scenario_quiet202603_up.yaml` (#178) 과 `scenario_chuseok_up_congested.yaml`
# 은 교통량 말고도 **수요 가정이 다르다** — 저쪽은 EV 15% + 기회 충전 20%,
# 이쪽은 EV 5% + 레이어 없음. 그대로 견주면 "평시라서 다른가" 와 "가정이 달라서
# 다른가" 가 섞인다. 기회 충전은 비용의 82% 를 지는 항이라 특히 그렇다.
#
# 그래서 이 파일은 **수요 가정을 추석과 똑같이 맞추고 교통량만 평시로** 둔다.
#   바뀌는 것   진입 교통량 (추석 9/25 UP 50,204대 → 평시 3/6 UP 32,941대, -34%)
#               기온 (22.18°C → 5.33°C) — 평시 3월의 실측이고 떼어낼 수 없다
#   같은 것     노선 · 공급 · 차종 · 출발 SoC · EV 15% · 기회 충전 20% · 인내
#
# ⚠ 기온이 같이 바뀐다. 충전 속도(cold_factor)에 걸리므로 **교통량만의 효과가
#   아니다.** 분리하려면 추석 config 의 기온만 5.33 으로 바꿔 한 번 더 돌릴 것.
# ⚠ EV 15% 는 **가정**이다 (실측 2026-03 경부 상행은 약 2.7~3.7%).
#   추석 무대와 같은 가정이라 비교가 성립한다는 뜻이지 평시의 실제가 아니다.
scenario_id: quiet_2026_up_congested
label: "2026 평시 2026-03-06 경부선 UP — 추석과 같은 수요 가정 (EV 15%, ⚠ 실측 비율 아님)"
corridor_id: gyeongbu_up
direction: UP
day_type: WEEKDAY_BASE  # 평시 10일(3월 2일 대체공휴일, 7~8일 주말 포함)의 대표일 3월 6일(금)

time:
  start_min: 0
  end_min: 1440
  dt_min: 5

demand:
  period: quiet202603
  volume_profile: data/processed/issue178_quiet202603/2026-03-06/UP/volume.csv
  demand_multiplier: 1.0
  ev_share: 0.05            # 통과 차량 중 EV 비중
  ev_count_method: fixed
  beta_binomial_concentration: 10000.0
  poisson_lognormal_sigma: 0.05
  charge_prob: 0.95
  # ★ 추석 무대(`scenario_chuseok_up_congested.yaml`)와 **같은 두 레이어**다.
  #   ev_share 0.05 를 ev_adoption 이 덮는다
  layers:
    - {kind: ev_adoption, ev_share: 0.15}
    - {kind: opportunity_charge, prob: 0.20, soc_margin: 0.5}
  safety_buffer_km: 30.0
  low_soc_threshold: 0.2
  through_profile: data/processed/issue178_quiet202603/2026-03-06/UP/through.csv
  entry_exit_profile: data/processed/issue178_quiet202603/2026-03-06/UP/entry_exit.csv
  od_profile: null  # 설·추석과 같다. #146 에서 TCS 혼합이 VDS 통과량 오차를 키웠다
  cruise_speed_kmh: 80.0
  escape_cost_min: 120.0
  escape_cost_sigma: 0.0
  # 줄을 서 있다가 인내가 끝나면 떠난다 (#147). **설·추석 무대와 같은 값**이라야
  # 사다리 격차를 두 무대에서 나란히 놓을 수 있다 — 끄면 "이탈 기준 120분" 이라고
  # 선언한 모형에서 372분을 기다리는 차가 생기고, 그 혼란이 바닥에 얹혀 사다리를
  # 부풀린다 (설 S0−S2 격차 884.3h 중 540.7h 가 그것이었다).
  renege: true
  patience_kind: uniform
  patience_shape: 0.142857      # 반폭 비율 h — U(70×0.857, 70×1.143) = U(60, 80)
  patience_median_min: 70.0     # 0 이면 escape_cost_min 을 쓴다 (= 가르지 않음)
  travel_time: fixed  # 설·추석과 같다. CTM 정체 재현율 기준 미달(평시는 실측 정체가 드묾)

vehicles:
  seed: 7
  departure_soc: holiday
  soc_profiles:
    holiday:
      dist: lognormal
      mu: -0.3567           # ⚠ ln(0.70) 은 절삭 전 중앙값. 실제 중앙값은 65.8%
      sigma: 0.35           # 모른다는 것을 넓이로 반영했다
      lo: 0.33              # ⚠ 행태 가드레일 (가정). docs/departure_soc.md
      hi: 1.00
    low:                    # ⚠ 대조군. Rupnik 의 휴게소 도착 SoC (#55 이전 기본값)
      a: 2.0
      b: 5.0
      lo: 0.10
      hi: 0.95
    high:                   # 대조군
      a: 5.0
      b: 2.0
      lo: 0.30
      hi: 0.95
  target_soc_cap: 0.8
  habit_soc: 0.0
  habit_soc_sigma: 0.0

environment:
  # https://www.weather.go.kr/w/weather/land/aws-obs.do
  temp_c: 5.33  # 기상청 날씨누리 2026-03-06 서울·대전·대구·부산 00/06/12/18시 실측 16개 평균 (issue178_quiet202603/kma_daily_mean.csv)

policy:
  stage: S0
  participation: 1.0
  params: {}
  ue:
    max_iter: 50
    gap_tol: 0.008
    min_gain_min: 1.0
    max_stops: 3

queue:
  discipline: FIFO
  charger_select: MAX_POWER_IDLE

output:
  write_snapshots: true
  snapshot_every_min: 5
