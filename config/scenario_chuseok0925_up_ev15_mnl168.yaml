# #168 천장값 본 실행용. #162 passenger266 의 config_2026-09-25_UP.yaml 을 그대로 복사하고
# scenario_id·label 과 EV 보급률 레이어(15%, 가정)만 바꿨다.
# 상대 경로(reports/issue160_ctm_daily/...)는 원래 저장소 루트 기준 — --data-root 로 준다.
# DB: #162 passenger266/scenario_sep18.sqlite 의 사본 (충전기 266기).
scenario_id: mnl168_chuseok_20260925_up_ev15
label: '#168 MNL 천장값 — 2026-09-25 UP · EV 15% 가정 · #162 passenger266 공급'
corridor_id: gyeongbu_up
direction: UP
day_type: CHUSEOK_PEAK
time:
  start_min: 0
  end_min: 1440
  dt_min: 5
demand:
  period: chuseok2026
  volume_profile: reports/issue160_ctm_daily/inputs/2026-09-25/UP/volume.csv
  demand_multiplier: 1.0
  ev_share: 0.05
  ev_count_method: fixed
  beta_binomial_concentration: 10000.0
  poisson_lognormal_sigma: 0.05
  charge_prob: 0.95
  layers:
  - kind: ev_adoption
    ev_share: 0.15
  safety_buffer_km: 30.0
  low_soc_threshold: 0.2
  through_profile: reports/issue160_ctm_daily/inputs/2026-09-25/UP/through.csv
  entry_exit_profile: reports/issue160_ctm_daily/inputs/2026-09-25/UP/entry_exit.csv
  od_profile: null
  cruise_speed_kmh: 80.0
  escape_cost_min: 120.0
  escape_cost_sigma: 0.0
  # ★ **포기는 꺼 둔다 — 이 config 의 용도 때문이다** (2026-11-13 명시).
  #
  #   #168 MNL 보정·검증용이다. 여기서 재는 것은 **휴게소 분배(TVD)** 이고,
  #   포기를 켜면 줄에서 차가 빠져 분배 자체가 달라진다. 그러면 "MNL 이 분배를
  #   더 잘 맞추나" 와 "포기가 분배를 바꾸나" 가 섞인다.
  #
  #   ⚠ **대가를 적어 둔다.** 포기가 꺼지면 "이탈 기준 120분" 이라고 선언한
  #     모형에서 그보다 오래 기다리는 차가 생긴다 (설 상행 S0 에서 372.5분).
  #     그 혼란 요인은 바닥(S0)에 가장 많이 얹히므로, **이 config 의 run 으로
  #     사다리 격차를 재면 안 된다.** 엔진 비교는 `scenario_chuseok_up_congested`
  #     (포기 켬 · 인내 U(60,80)) 쪽에서 한다.
  #
  #   값을 바꾸지 않았다 — 원래 기본값(꺼짐)을 **적었을 뿐**이다. 빠뜨린 것과
  #   일부러 끈 것을 글로 가른다 (`test_every_scenario_states_its_renege_choice`).
  renege: false
  travel_time: fixed
vehicles:
  seed: 7
  departure_soc: holiday
  soc_profiles:
    holiday:
      dist: lognormal
      mu: -0.3567
      sigma: 0.35
      lo: 0.33
      hi: 1.0
    low:
      a: 2.0
      b: 5.0
      lo: 0.1
      hi: 0.95
    high:
      a: 5.0
      b: 2.0
      lo: 0.3
      hi: 0.95
  target_soc_cap: 0.8
  habit_soc: 0.0
  habit_soc_sigma: 0.0
environment:
  temp_c: 22.18125
policy:
  stage: UE
  participation: 1.0
  params: {}
  ue:
    max_iter: 50
    gap_tol: 0.008
    min_gain_min: 1.0
    max_stops: 3
queue:
  discipline: FIFO
  charger_select: MAX_POWER_IDLE
output:
  write_snapshots: false
  snapshot_every_min: 5
