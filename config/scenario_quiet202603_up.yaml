# #178: 설의 노선·차량·충전 행태 설정을 유지하고 평시(2026-03-02~11) 수요·기온만 교체한다.
# EV 5%는 설·추석과 같은 비교 가정이며 실제 EV 통행 비율이 아니다. 출발 SoC 도 설과 같은 holiday 프로파일이다.
# 공급: #178 실행은 BASE215(sp3_64_daily_base215_runner.adapter). 3월 충전이력(29곳·115기)이 설과 같아 추가 장비 0기.
# 진입량 최대일 3/6. 날짜별 실행·검증은 scripts/run_quiet_replay_178.py, docs/data_validation/issue178_quiet_replay.md.
scenario_id: quiet_2026_up_base
label: "2026 평시 2026-03-06 경부선 UP"
corridor_id: gyeongbu_up
direction: UP
day_type: WEEKDAY_BASE  # 평시 10일(3월 2일 대체공휴일, 7~8일 주말 포함)의 대표일 3월 6일(금)

time:
  start_min: 0
  end_min: 1440
  dt_min: 5

demand:
  period: quiet202603
  volume_profile: data/processed/issue178_quiet202603/2026-03-06/UP/volume.csv
  demand_multiplier: 1.0
  ev_share: 0.05            # 통과 차량 중 EV 비중
  ev_count_method: fixed
  beta_binomial_concentration: 10000.0
  poisson_lognormal_sigma: 0.05
  charge_prob: 0.95
  layers: []
  safety_buffer_km: 30.0
  low_soc_threshold: 0.2
  through_profile: data/processed/issue178_quiet202603/2026-03-06/UP/through.csv
  entry_exit_profile: data/processed/issue178_quiet202603/2026-03-06/UP/entry_exit.csv
  od_profile: null  # 설·추석과 같다. #146 에서 TCS 혼합이 VDS 통과량 오차를 키웠다
  cruise_speed_kmh: 80.0
  escape_cost_min: 120.0
  escape_cost_sigma: 0.0
  travel_time: fixed  # 설·추석과 같다. CTM 정체 재현율 기준 미달(평시는 실측 정체가 드묾)

vehicles:
  seed: 7
  departure_soc: holiday
  soc_profiles:
    holiday:
      dist: lognormal
      mu: -0.3567           # ⚠ ln(0.70) 은 절삭 전 중앙값. 실제 중앙값은 65.8%
      sigma: 0.35           # 모른다는 것을 넓이로 반영했다
      lo: 0.33              # ⚠ 행태 가드레일 (가정). docs/departure_soc.md
      hi: 1.00
    low:                    # ⚠ 대조군. Rupnik 의 휴게소 도착 SoC (#55 이전 기본값)
      a: 2.0
      b: 5.0
      lo: 0.10
      hi: 0.95
    high:                   # 대조군
      a: 5.0
      b: 2.0
      lo: 0.30
      hi: 0.95
  target_soc_cap: 0.8
  habit_soc: 0.0
  habit_soc_sigma: 0.0

environment:
  # https://www.weather.go.kr/w/weather/land/aws-obs.do
  temp_c: 5.33  # 기상청 날씨누리 2026-03-06 서울·대전·대구·부산 00/06/12/18시 실측 16개 평균 (issue178_quiet202603/kma_daily_mean.csv)

policy:
  stage: UE
  participation: 1.0
  params: {}
  ue:
    max_iter: 50
    gap_tol: 0.008
    min_gain_min: 1.0
    max_stops: 3

queue:
  discipline: FIFO
  charger_select: MAX_POWER_IDLE

output:
  write_snapshots: true
  snapshot_every_min: 5
