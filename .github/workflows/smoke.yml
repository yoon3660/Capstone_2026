name: CI smoke test

# 일시적인 진단용. ci.yml 은 main 푸시와 PR 에서만 돌아서 이 브랜치에서 확인할 수
# 없다. 단계는 ci.yml 과 똑같이 두고 트리거만 이 브랜치로 바꿨다.
#
# ci.yml 은 2026-09-15 이후 한 번도 실행된 적이 없다 (전부 startup_failure).
# 즉 내용이 검증된 적이 없다 — 러너에는 data/ 가 없는데 verify_setup 이 그걸
# 필요로 하는지 같은 것이 아직 미확인이다. 병합 전에 여기서 확인한다.
#
# 확인이 끝나면 삭제한다.

on:
  push:
    branches:
      - develop/26

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint
        run: ruff check src tests scripts

      - name: 테스트
        run: python -m pytest -q

      - name: 환경 셀프 체크 (T-01~T-04 완료 조건)
        run: python scripts/verify_setup.py
